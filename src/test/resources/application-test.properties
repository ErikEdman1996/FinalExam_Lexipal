# ── H2 In-Memory Database ──
spring.datasource.url=jdbc:h2:mem:lexipal_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ── Disable Keycloak JWT issuer validation ──
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://not-used.example.com

# ── JwtAuthConverter placeholder values ──
jwt.auth.converter.resource-id.name=lexipal-client
jwt.auth.converter.principal-attribute=preferred_username

# ── Disable caching in tests ──
spring.cache.type=none
